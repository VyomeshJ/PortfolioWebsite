name: Portfolio CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to homelab
    runs-on: self-hosted
    needs: quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    environment: production
    concurrency:
      group: portfolio-production
      cancel-in-progress: false

    steps:
      - name: Deploy on server
        env:
          APP_DIR: /home/vjam/portfolio/PortfolioWebsite
          PM2_APP_NAME: portfolio-website
        run: |
          set -euo pipefail

          test -d "$APP_DIR/.git"

          node -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 20 || (major === 20 && minor < 9)) { throw new Error('Next.js requires Node.js >=20.9.0') }"
          command -v pm2 >/dev/null

          git -C "$APP_DIR" fetch --prune origin main
          git -C "$APP_DIR" reset --hard origin/main

          cd "$APP_DIR"
          npm ci --prefer-offline --no-audit
          npm run build

          pm2 reload "$PM2_APP_NAME" --update-env || pm2 start npm --name "$PM2_APP_NAME" -- run start
          pm2 save
