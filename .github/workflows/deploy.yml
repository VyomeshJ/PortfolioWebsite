name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: self-hosted
    timeout-minutes: 10
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and deploy container
        shell: bash
        env:
          CONTAINER_NAME: portfolio-website
          HOST_PORT: "3001"
        run: |
          set -euo pipefail

          IMAGE_NAME="${CONTAINER_NAME}:${GITHUB_SHA}"
          docker build \
            --tag "$IMAGE_NAME" \
            --tag "${CONTAINER_NAME}:latest" \
            .

          if command -v pm2 >/dev/null 2>&1; then
            pm2 delete "$CONTAINER_NAME" || true
            pm2 save || true
          fi

          docker rm --force "$CONTAINER_NAME" 2>/dev/null || true
          docker run --detach \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            --publish "${HOST_PORT}:80" \
            "$IMAGE_NAME"

          for attempt in {1..20}; do
            if curl --fail --silent "http://127.0.0.1:${HOST_PORT}/" > /dev/null; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")" != "true" ]; then
              docker logs "$CONTAINER_NAME"
              exit 1
            fi
            sleep 1
          done

          docker logs "$CONTAINER_NAME"
          exit 1
